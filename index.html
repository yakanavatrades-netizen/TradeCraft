
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlantis Trade Group</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',sans-serif;background:#0c1015;color:white;}
:root{--primary:#00bcd4;--secondary:#072f49;--accent:#1f6ef0;--bg-card:#111820;--text-light:#d0d3d6;}
.tabBtn{cursor:pointer;padding:10px 18px;background:none;color:white;border:none;font-size:15px;}
.section{padding:40px;max-width:1200px;margin:auto;}
.card{background:var(--bg-card);padding:25px;border-radius:12px;margin-bottom:20px;}
</style>
</head>
<body>

<!-- TAB BAR -->
<div style="position:fixed;top:0;width:100%;background:#07131c;padding:12px;display:flex;gap:20px;z-index:9999;">
<button class="tabBtn" onclick="openTab('homeTab')">Home</button>
<button class="tabBtn" onclick="openTab('dashboardTab')">Dashboard</button>
<button class="tabBtn" onclick="openTab('signalsTab')">Signals</button>
<button class="tabBtn" onclick="openTab('videosTab')">Videos</button>
<button class="tabBtn" onclick="openTab('reportsTab')">Reports</button>
<button class="tabBtn" onclick="openTab('learningTab')">Learning</button>
<button class="tabBtn" onclick="openTab('adminTab')">Admin</button>
</div>

<script>
function hideAllTabs(){['homeTab','dashboardTab','signalsTab','videosTab','reportsTab','learningTab','adminTab'].forEach(id=>document.getElementById(id).style.display='none');}
function openTab(tab){hideAllTabs();document.getElementById(tab).style.display='block';}
window.onload=()=>openTab('homeTab');
</script>

<!-- HOME TAB -->
<div id="homeTab" class="section">
<h1>Atlantis Trade Group</h1>
<p>Welcome to the professional trading community.</p>
</div>

<!-- DASHBOARD TAB -->
<div id="dashboardTab" class="section" style="display:none;">
<h2>Dashboard</h2>
<div class="card">Member Dashboard Modules</div>
</div>

<!-- SIGNALS TAB -->
<div id="signalsTab" class="section" style="display:none;">
<h2>Signals</h2>
<div class="card">Signals Content</div>
</div>

<!-- VIDEOS TAB -->
<div id="videosTab" class="section" style="display:none;">
<h2>Videos</h2>
<div class="card">Video Library</div>
</div>

<!-- REPORTS TAB -->
<div id="reportsTab" class="section" style="display:none;">
<h2>Reports</h2>
<div class="card">Macro & Weekly Reports</div>
</div>

<!-- LEARNING TAB -->
<div id="learningTab" class="section" style="display:none;">
<h2>Learning Center</h2>
<div class="card">Courses & Education</div>
</div>

<!-- ADMIN TAB -->
<div id="adminTab" class="section" style="display:none;">
<h2>Admin Panel</h2>
<div class="card">Admin Management Tools</div>
</div>

</body>
</html>
